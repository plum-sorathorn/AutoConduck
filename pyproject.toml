[project]
name = "autoconduck"
version = "0.3.0"
description = "Local zero-overhead model router + task orchestrator for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "tiktoken>=0.6",
  "textual>=0.70",
  "litellm[proxy]>=1.40",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "llama-cpp-python>=0.3.0",
  "outlines>=0.1.0",
  "lancedb>=0.10",
  "json-repair",
]
[project.scripts]
autoconduck = "autoconduck.main:main"
conduck = "autoconduck.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoconduck", "autoconduck.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
